            cp -f "${ROOT}/flutter/lib/generated_bridge.freezed.dart" rustdesk-src/flutter/lib/
          fi
          if [ -f "${ROOT}/flutter/macos/Runner/bridge_generated.h" ]; then
            cp -f "${ROOT}/flutter/macos/Runner/bridge_generated.h" rustdesk-src/flutter/macos/Runner/
          fi
          if [ -f "${ROOT}/flutter/ios/Runner/bridge_generated.h" ]; then
            cp -f "${ROOT}/flutter/ios/Runner/bridge_generated.h" rustdesk-src/flutter/ios/Runner/
          fi

      - name: Download Rustdesk library (aarch64)
        uses: actions/download-artifact@v4
        with:
          name: librustdesk.so.aarch64-linux-android
          path: rustdesk-src/flutter/android/app/src/main/jniLibs/arm64-v8a

      - name: Download Rustdesk library (armv7)
        uses: actions/download-artifact@v4
        with:
          name: librustdesk.so.armv7-linux-androideabi
          path: rustdesk-src/flutter/android/app/src/main/jniLibs/armeabi-v7a

      - name: Download Rustdesk library (x86_64)
        uses: actions/download-artifact@v4
        with:
          name: librustdesk.so.x86_64-linux-android
          path: rustdesk-src/flutter/android/app/src/main/jniLibs/x86_64

      - name: Place native libraries
        run: |
          set -euo pipefail
          place_so() {
            local dest_dir="$1"
            local found
            found=$(find "${dest_dir}" -name 'liblibrustdesk.so' -type f | head -n 1 || true)
            if [ -z "${found}" ]; then
              echo "missing liblibrustdesk.so under ${dest_dir}"
              find "${dest_dir}" -type f || true
              exit 1
            fi
            mkdir -p "${dest_dir}"
            if [ "${found}" != "${dest_dir}/liblibrustdesk.so" ]; then
              cp -f "${found}" "${dest_dir}/liblibrustdesk.so"
            fi
          }
          place_so rustdesk-src/flutter/android/app/src/main/jniLibs/arm64-v8a
          place_so rustdesk-src/flutter/android/app/src/main/jniLibs/armeabi-v7a
          place_so rustdesk-src/flutter/android/app/src/main/jniLibs/x86_64

      - name: Build universal APK
        working-directory: rustdesk-src
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          export PATH="${JAVA_HOME}/bin:${PATH}"
          if [ ! -d "${JAVA_HOME}" ]; then
            echo "JAVA_HOME ${JAVA_HOME} is missing"
            exit 1
          fi
          if [ -f ./flutter/android/gradle.properties ]; then
            sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          fi
          sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
          if ! grep -q 'signingConfigs.debug' ./flutter/android/app/build.gradle; then
            echo "failed to switch signingConfigs.release to debug for the intermediate APK"
            exit 1
          fi
          mv ./flutter/android/app/src/main/jniLibs/arm64-v8a/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so
          cp "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" ./flutter/android/app/src/main/jniLibs/arm64-v8a/
          mv ./flutter/android/app/src/main/jniLibs/armeabi-v7a/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/armeabi-v7a/librustdesk.so
          cp "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi/libc++_shared.so" ./flutter/android/app/src/main/jniLibs/armeabi-v7a/
          mv ./flutter/android/app/src/main/jniLibs/x86_64/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/x86_64/librustdesk.so
          cp "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/x86_64-linux-android/libc++_shared.so" ./flutter/android/app/src/main/jniLibs/x86_64/
          pushd flutter
          flutter build apk --release --target-platform android-arm64,android-arm,android-x64
          popd
          APK_SRC="./flutter/build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "${APK_SRC}" ]; then
            echo "flutter did not produce ${APK_SRC}"
            ls -la ./flutter/build/app/outputs/flutter-apk/ || true
            exit 1
          fi
          mkdir -p "${GITHUB_WORKSPACE}/signed-apk"
          cp "${APK_SRC}" "${GITHUB_WORKSPACE}/signed-apk/rustdesk-${VERSION}-universal.apk"

      - name: Setup sign tool version variable
        shell: bash
        run: |
          BUILD_TOOL_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)
          echo "ANDROID_SIGN_TOOL_VERSION=${BUILD_TOOL_VERSION}" >> "${GITHUB_ENV}"
          echo "Last build tool version is: ${BUILD_TOOL_VERSION}"

      - name: Sign app APK
        uses: r0adkll/sign-android-release@349ebdef58775b1e0d8099458af0816dc79b6407
        id: sign-rustdesk
        with:
          releaseDirectory: ./signed-apk
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: ${{ env.ANDROID_SIGN_TOOL_VERSION }}

      - name: Rename signed APK
        id: apk
        run: |
          set -euo pipefail
          SIGNED="${{ steps.sign-rustdesk.outputs.signedReleaseFile }}"
          DEST="${GITHUB_WORKSPACE}/rustdesk-${VERSION}-universal.apk"
          if [ -z "${SIGNED}" ] || [ ! -f "${SIGNED}" ]; then
            echo "signing did not produce a signed APK at '${SIGNED}'"
            ls -la signed-apk || true
            exit 1
          fi
          cp "${SIGNED}" "${DEST}"
          echo "path=${DEST}" >> "${GITHUB_OUTPUT}"
          ls -lh "${DEST}"

      - name: Publish signed APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: "${{ env.CUSTOM_APP_NAME }} ${{ env.VERSION }}"
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: ${{ steps.apk.outputs.path }}
