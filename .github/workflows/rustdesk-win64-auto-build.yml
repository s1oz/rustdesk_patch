name: Auto Sync & Build RustDesk Windows x64

on:
  # 1. 每天北京时间 08:00 (UTC 00:00) 自动检查上游官方是否发布了新版本，若有则自动编译发布
  schedule:
    - cron: '0 0 * * *'
  # 2. 支持在 GitHub Actions 页面手动点击 "Run workflow" 立即触发编译
  workflow_dispatch:
    inputs:
      version:
        description: '指定要编译的官方版本号（例如 1.4.9 或 1.5.0，留空则自动拉取官方最新 Release）'
        required: false
        default: ''
      force_build:
        description: '若当前仓库已存在同版本 Release，是否强制重新编译覆盖'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  # ============================================================================
  # 阶段 1：检查官方最新 Release 版本，判断是否需要触发编译
  # ============================================================================
  check-upstream:
    name: Check Upstream Release
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      version: ${{ steps.check.outputs.version }}
      flutter_version: ${{ steps.upstream_env.outputs.flutter_version }}
      frb_version: ${{ steps.upstream_env.outputs.frb_version }}
      vcpkg_commit: ${{ steps.upstream_env.outputs.vcpkg_commit }}
    steps:
      - name: Check official rustdesk/rustdesk latest release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          FORCE_BUILD: ${{ github.event.inputs.force_build }}
        run: |
          set -e
          if [ -n "$INPUT_VERSION" ]; then
            TARGET_VER="${INPUT_VERSION#v}"
            echo "手动指定编译版本: $TARGET_VER"
          else
            # 从官方 rustdesk/rustdesk 获取最新正式版 tag_name
            TARGET_VER=$(gh api repos/rustdesk/rustdesk/releases/latest --jq '.tag_name')
            TARGET_VER="${TARGET_VER#v}"
            echo "检测到官方最新 Release 版本: $TARGET_VER"
          fi

          echo "version=$TARGET_VER" >> "$GITHUB_OUTPUT"

          # 检查当前仓库是否已经发布过该版本的 Release
          if gh release view "$TARGET_VER" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            # 手动触发 (workflow_dispatch) 默认允许重新构建覆盖，定时任务 (schedule) 则跳过已发布的版本
            if [ "$FORCE_BUILD" = "true" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              echo "当前仓库已存在版本 $TARGET_VER，执行重新编译并覆盖 Release 产物。"
              echo "should_build=true" >> "$GITHUB_OUTPUT"
            else
              echo "当前仓库已存在版本 $TARGET_VER 的 Release，跳过本次定时构建。"
              echo "should_build=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "当前仓库尚未发布版本 $TARGET_VER，开始触发自动构建。"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract exact toolchain versions from upstream workflow
        id: upstream_env
        if: steps.check.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.check.outputs.version }}
        run: |
          set -e
          # 动态读取对应版本官方工作流中的 FLUTTER_VERSION / FLUTTER_RUST_BRIDGE_VERSION / VCPKG_COMMIT_ID
          curl -fsSL "https://raw.githubusercontent.com/rustdesk/rustdesk/${VER}/.github/workflows/flutter-build.yml" -o upstream_build.yml
          curl -fsSL "https://raw.githubusercontent.com/rustdesk/rustdesk/${VER}/.github/workflows/bridge.yml" -o upstream_bridge.yml 2>/dev/null || true

          FLUTTER_VER=$(grep -E '^\s*FLUTTER_VERSION:' upstream_build.yml upstream_bridge.yml 2>/dev/null | head -n1 | sed -E 's/.*"([^"]+)".*/\1/' || true)
          FRB_VER=$(grep -E '^\s*FLUTTER_RUST_BRIDGE_VERSION:' upstream_build.yml upstream_bridge.yml 2>/dev/null | head -n1 | sed -E 's/.*"([^"]+)".*/\1/' || true)
          VCPKG_ID=$(grep -E '^\s*VCPKG_COMMIT_ID:' upstream_build.yml upstream_bridge.yml 2>/dev/null | head -n1 | sed -E 's/.*"([^"]+)".*/\1/' || true)

          echo "flutter_version=${FLUTTER_VER:-3.24.5}" >> "$GITHUB_OUTPUT"
          echo "frb_version=${FRB_VER:-1.80.1}" >> "$GITHUB_OUTPUT"
          echo "vcpkg_commit=${VCPKG_ID:-9e593bb18ea69cc5095e012465dcd675a822ed0d}" >> "$GITHUB_OUTPUT"
          echo "解析官方工具链版本: Flutter=${FLUTTER_VER:-3.24.5}, FRB=${FRB_VER:-1.80.1}, VCPKG=${VCPKG_ID}"

  # ============================================================================
  # 阶段 2：编译打包 Windows 64位 (x86_64) 客户端并发布到当前仓库 Releases
  # ============================================================================
  build-windows-x64:
    name: Build Windows x64 Client
    needs: check-upstream
    if: needs.check-upstream.outputs.should_build == 'true'
    runs-on: windows-2022
    env:
      VERSION: ${{ needs.check-upstream.outputs.version }}
      FLUTTER_VERSION: ${{ needs.check-upstream.outputs.flutter_version }}
      FLUTTER_RUST_BRIDGE_VERSION: ${{ needs.check-upstream.outputs.frb_version }}
      VCPKG_COMMIT_ID: ${{ needs.check-upstream.outputs.vcpkg_commit }}
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Export GitHub Actions cache environment variables (for vcpkg x-gha)
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');

      - name: Checkout current repository (for patch_rustdesk.py)
        uses: actions/checkout@v4
        with:
          path: custom-scripts

      - name: Clone official rustdesk/rustdesk at tag ${{ env.VERSION }}
        shell: pwsh
        run: |
          git clone --branch "${{ env.VERSION }}" --depth 1 --recurse-submodules https://github.com/rustdesk/rustdesk.git rustdesk-src
          if ($LASTEXITCODE -ne 0) { throw "git clone failed" }

      - name: Sanitize & Apply custom patch (Hide CM Popup & Redirect Auto-Update URL)
        shell: pwsh
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
          # 如需可选内置自建服务器，可在仓库 Settings -> Secrets and variables -> Actions 中添加以下 Secrets：
          RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          RELAY_SERVER: ${{ secrets.RELAY_SERVER }}
          API_SERVER: ${{ secrets.API_SERVER }}
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $patchPath = ".\custom-scripts\patch_rustdesk.py"
          if (Test-Path $patchPath) {
            # 1. 自动清理误带的 ``` Markdown 代码块标记与重复粘贴内容
            $raw = Get-Content $patchPath -Raw -Encoding UTF8
            $raw = $raw -replace '(?m)^\s*```.*$', ''
            if ($raw -match 'main\(\)\s*#!/usr/bin/env python3') {
              $raw = ($raw -split 'main\(\)\s*#!/usr/bin/env python3')[0] + "main()`n"
            }
            # 2. 自动升级旧版 patch_rustdesk.py 中的 option2bool 正则，防止把 crate::config::option2bool 替换成 crate::config::true
            $raw = $raw.Replace("r'option2bool\(", "r'(?:[a-zA-Z0-9_]+::)*option2bool\(")
            $raw = $raw.Replace("r'(pub\s+fn\s+allow_hide_cm", "r'(pub\s+fn\s+(?:allow_)?hide_cm")
            Set-Content -Path $patchPath -Value $raw -Encoding UTF8
          }
          python -X utf8 $patchPath --root .\rustdesk-src --repo "${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) { throw "patch_rustdesk.py failed" }

      - name: Setup vcpkg with GitHub Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

      - name: Install Windows native dependencies via vcpkg manifest
        shell: pwsh
        working-directory: rustdesk-src
        run: |
          if (Test-Path "vcpkg.json") {
            & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet x64-windows-static --x-install-root="$env:VCPKG_ROOT\installed"
          } else {
            & "$env:VCPKG_ROOT\vcpkg.exe" install libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static aom:x64-windows-static
          }
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed" }

      - name: Setup LLVM (for bindgen & flutter_rust_bridge)
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files\LLVM\bin\libclang.dll")) {
            choco install -y llvm
          }
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Setup Rust stable toolchain (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rustdesk-src -> target"

      - name: Setup Flutter (${{ env.FLUTTER_VERSION }})
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Replace engine with RustDesk custom Flutter engine (Windows x64)
        shell: pwsh
        working-directory: rustdesk-src
        run: |
          flutter config --enable-windows-desktop
          flutter doctor -v
          flutter precache --windows
          $flutterBin = (Get-Command flutter.bat -ErrorAction SilentlyContinue).Source
          if (-not $flutterBin) { $flutterBin = (Get-Command flutter).Source }
          $flutterRoot = Split-Path (Split-Path $flutterBin -Parent) -Parent
          $engineDir = Join-Path $flutterRoot "bin\cache\artifacts\engine\windows-x64-release"
          Write-Host "Replacing Flutter Windows x64 engine in: $engineDir"
          Invoke-WebRequest -Uri "https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip" -OutFile "windows-x64-release.zip"
          Expand-Archive -Path "windows-x64-release.zip" -DestinationPath $engineDir -Force
          Remove-Item "windows-x64-release.zip" -Force

      - name: Generate Flutter-Rust Bridge (FFI)
        shell: pwsh
        working-directory: rustdesk-src
        run: |
          if (-not (Get-Command flutter_rust_bridge_codegen -ErrorAction SilentlyContinue)) {
            cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
            if ($LASTEXITCODE -ne 0) { throw "cargo install flutter_rust_bridge_codegen failed" }
          }
          Push-Location flutter
          flutter pub get
          if ($LASTEXITCODE -ne 0) { throw "flutter pub get failed" }
          Pop-Location
          flutter_rust_bridge_codegen --rust-input .\src\flutter_ffi.rs --dart-output .\flutter\lib\generated_bridge.dart --llvm-path "C:\Program Files\LLVM"
          if ($LASTEXITCODE -ne 0) { throw "flutter_rust_bridge_codegen failed" }
          # 修复 ffigen 在 Windows 下生成的 DartPort Bool/Uint8 签名差异（与官方 build.py ffi_bindgen_function_refactor 保持一致）
          $bridgeDart = ".\flutter\lib\generated_bridge.dart"
          if (Test-Path $bridgeDart) {
            (Get-Content $bridgeDart -Raw -Encoding UTF8).Replace(
              "ffi.NativeFunction<ffi.Bool Function(DartPort",
              "ffi.NativeFunction<ffi.Uint8 Function(DartPort"
            ) | Set-Content $bridgeDart -Encoding UTF8
          }

      - name: Build RustDesk Windows x64 & Bundle Drivers into Single EXE
        shell: pwsh
        working-directory: rustdesk-src
        run: |
          pip install -r libs/portable/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "pip install requirements.txt failed" }

          # 1. 编译 Rust 核心库 (librustdesk.dll) 与 Flutter Windows 桌面端 (flutter\build\windows\x64\runner\Release)
          python -X utf8 build.py --portable --flutter --hwcodec --vram --skip-portable-pack
          if ($LASTEXITCODE -ne 0) { throw "build.py compilation failed with exit code $LASTEXITCODE" }

          $releaseDir = "flutter\build\windows\x64\runner\Release"
          if (-not (Test-Path "$releaseDir\rustdesk.exe")) {
            throw "ERROR: $releaseDir\rustdesk.exe was not generated by flutter build windows!"
          }

          # 确保 librustdesk.dll 与 dylib_virtual_display.dll 均已拷入 Release 目录
          if ((Test-Path "target\release\librustdesk.dll") -and (-not (Test-Path "$releaseDir\librustdesk.dll"))) {
            Copy-Item "target\release\librustdesk.dll" "$releaseDir\librustdesk.dll" -Force
          }
          if ((Test-Path "target\release\deps\dylib_virtual_display.dll") -and (-not (Test-Path "$releaseDir\dylib_virtual_display.dll"))) {
            Copy-Item "target\release\deps\dylib_virtual_display.dll" "$releaseDir\dylib_virtual_display.dll" -Force
          }

          # 2. 按照官方 flutter-build.yml 规范，将 Release 目录重命名为 .\rustdesk 并注入虚拟显示器驱动
          if (Test-Path ".\rustdesk") { Remove-Item ".\rustdesk" -Recurse -Force }
          Move-Item -Path $releaseDir -Destination ".\rustdesk" -Force

          Invoke-WebRequest -Uri "https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip" -OutFile "usbmmidd_v2.zip"
          Expand-Archive -Path "usbmmidd_v2.zip" -DestinationPath ".\rustdesk" -Force
          Remove-Item "usbmmidd_v2.zip" -Force

          Write-Host "=== Files inside .\rustdesk before portable packing ==="
          Get-ChildItem ".\rustdesk" | Select-Object Name, Length | Format-Table -AutoSize

          # 3. 进入 libs/portable 执行打包（注意 -f ../../rustdesk/ 末尾必须带斜杠，否则相对路径截断异常会导致只打出 <1MB 空壳）
          Push-Location libs/portable
          if (Test-Path "data.bin") { Remove-Item "data.bin" -Force }
          # 强制重新编译 rustdesk-portable-packer，避免 Swatinem/rust-cache 复用旧空壳二进制
          cargo clean -p rustdesk-portable-packer 2>$null
          python -X utf8 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
          if ($LASTEXITCODE -ne 0) { throw "generate.py portable packing failed" }
          Pop-Location

          Move-Item -Path "./target/release/rustdesk-portable-packer.exe" -Destination "./rustdesk-${{ env.VERSION }}-install.exe" -Force
          Copy-Item "./rustdesk-${{ env.VERSION }}-install.exe" "./rustdesk-${{ env.VERSION }}-x86_64.exe" -Force

          # 4. 校验最终生成的单文件 EXE 体积（正常包含 librustdesk.dll + flutter_windows.dll 压缩后应在 20MB 以上）
          $exeItem = Get-Item "./rustdesk-${{ env.VERSION }}-x86_64.exe"
          $sizeMB = [math]::Round($exeItem.Length / 1MB, 2)
          Write-Host "Generated EXE size: $sizeMB MB ($($exeItem.Length) bytes)"
          if ($exeItem.Length -lt 15MB) {
            throw "ERROR: Generated EXE is abnormally small ($sizeMB MB < 15 MB)! Portable packing failed to embed Release payload."
          }

      - name: Publish to GitHub Releases (Auto-Update Endpoint)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: "RustDesk ${{ env.VERSION }} (Custom Windows x64)"
          body: |
            基于官方 RustDesk `${{ env.VERSION }}` 自动同步编译的 Windows 64位 (x86_64) 客户端：
            - **静默被控**：已移除/隐藏被控端连接管理弹窗（CM 窗口）
            - **自动更新**：已将客户端检查更新与自动更新地址指向 `${{ github.repository }}`
          draft: false
          prerelease: false
          make_latest: true
          files: |
            rustdesk-src/rustdesk-${{ env.VERSION }}-x86_64.exe
            rustdesk-src/rustdesk-${{ env.VERSION }}-install.exe
