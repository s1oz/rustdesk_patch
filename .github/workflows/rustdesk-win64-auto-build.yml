          fi

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: android-bridge-artifact
          path: android-bridge-artifact

      - name: Place bridge files into rustdesk-src
        run: |
          set -euo pipefail
          # Accept either a staged tree (src/..., flutter/...) or a nested prefix.
          ROOT="android-bridge-artifact"
          if [ -d "${ROOT}/bridge-out" ]; then ROOT="${ROOT}/bridge-out"; fi
