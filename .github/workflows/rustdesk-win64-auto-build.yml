name: Auto Sync & Build RustDesk Windows x64

on:
  # 1. 每天北京时间 08:00 (UTC 00:00) 自动检查上游官方是否发布了新版本，若有则自动编译发布
  schedule:
    - cron: '0 0 * * *'
  # 2. 支持在 GitHub Actions 页面手动点击 "Run workflow" 立即触发编译
  workflow_dispatch:
    inputs:
      version:
        description: '指定要编译的官方版本号（例如 1.4.9 或 1.5.0，留空则自动拉取官方最新 Release）'
        required: false
        default: ''
      force_build:
        description: '若当前仓库已存在同版本 Release，是否强制重新编译覆盖'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  # ============================================================================
  # 阶段 1：检查官方最新 Release 版本，判断是否需要触发编译
  # ============================================================================
  check-upstream:
    name: Check Upstream Release
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      version: ${{ steps.check.outputs.version }}
      flutter_version: ${{ steps.upstream_env.outputs.flutter_version }}
      frb_version: ${{ steps.upstream_env.outputs.frb_version }}
      vcpkg_commit: ${{ steps.upstream_env.outputs.vcpkg_commit }}
    steps:
      - name: Check official rustdesk/rustdesk latest release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          FORCE_BUILD: ${{ github.event.inputs.force_build }}
        run: |
          set -e
          if [ -n "$INPUT_VERSION" ]; then
            TARGET_VER="${INPUT_VERSION#v}"
            echo "手动指定编译版本: $TARGET_VER"
          else
            # 从官方 rustdesk/rustdesk 获取最新正式版 tag_name
            TARGET_VER=$(gh api repos/rustdesk/rustdesk/releases/latest --jq '.tag_name')
            TARGET_VER="${TARGET_VER#v}"
            echo "检测到官方最新 Release 版本: $TARGET_VER"
          fi

          echo "version=$TARGET_VER" >> "$GITHUB_OUTPUT"

          # 检查当前仓库是否已经发布过该版本的 Release
          if gh release view "$TARGET_VER" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            if [ "$FORCE_BUILD" = "true" ]; then
              echo "当前仓库已存在版本 $TARGET_VER，但启用了 force_build，继续编译。"
              echo "should_build=true" >> "$GITHUB_OUTPUT"
            else
              echo "当前仓库已存在版本 $TARGET_VER 的 Release，跳过本次构建。"
              echo "should_build=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "当前仓库尚未发布版本 $TARGET_VER，开始触发自动构建。"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract exact toolchain versions from upstream workflow
        id: upstream_env
        if: steps.check.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.check.outputs.version }}
        run: |
          set -e
          # 动态读取对应版本官方工作流中的 FLUTTER_VERSION / FLUTTER_RUST_BRIDGE_VERSION / VCPKG_COMMIT_ID
          curl -fsSL "https://raw.githubusercontent.com/rustdesk/rustdesk/${VER}/.github/workflows/flutter-build.yml" -o upstream_build.yml
          curl -fsSL "https://raw.githubusercontent.com/rustdesk/rustdesk/${VER}/.github/workflows/bridge.yml" -o upstream_bridge.yml 2>/dev/null || true

          FLUTTER_VER=$(grep -E '^\s*FLUTTER_VERSION:' upstream_build.yml upstream_bridge.yml 2>/dev/null | head -n1 | sed -E 's/.*"([^"]+)".*/\1/' || true)
          FRB_VER=$(grep -E '^\s*FLUTTER_RUST_BRIDGE_VERSION:' upstream_build.yml upstream_bridge.yml 2>/dev/null | head -n1 | sed -E 's/.*"([^"]+)".*/\1/' || true)
          VCPKG_ID=$(grep -E '^\s*VCPKG_COMMIT_ID:' upstream_build.yml upstream_bridge.yml 2>/dev/null | head -n1 | sed -E 's/.*"([^"]+)".*/\1/' || true)

          echo "flutter_version=${FLUTTER_VER:-3.24.5}" >> "$GITHUB_OUTPUT"
          echo "frb_version=${FRB_VER:-1.80.1}" >> "$GITHUB_OUTPUT"
          echo "vcpkg_commit=${VCPKG_ID:-9e593bb18ea69cc5095e012465dcd675a822ed0d}" >> "$GITHUB_OUTPUT"
          echo "解析官方工具链版本: Flutter=${FLUTTER_VER:-3.24.5}, FRB=${FRB_VER:-1.80.1}, VCPKG=${VCPKG_ID}"

  # ============================================================================
  # 阶段 2：编译打包 Windows 64位 (x86_64) 客户端并发布到当前仓库 Releases
  # ============================================================================
  build-windows-x64:
    name: Build Windows x64 Client
    needs: check-upstream
    if: needs.check-upstream.outputs.should_build == 'true'
    runs-on: windows-2022
    env:
      VERSION: ${{ needs.check-upstream.outputs.version }}
      FLUTTER_VERSION: ${{ needs.check-upstream.outputs.flutter_version }}
      FLUTTER_RUST_BRIDGE_VERSION: ${{ needs.check-upstream.outputs.frb_version }}
      VCPKG_COMMIT_ID: ${{ needs.check-upstream.outputs.vcpkg_commit }}
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Export GitHub Actions cache environment variables (for vcpkg x-gha)
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');

      - name: Checkout current repository (for patch_rustdesk.py)
        uses: actions/checkout@v4
        with:
          path: custom-scripts

      - name: Clone official rustdesk/rustdesk at tag ${{ env.VERSION }}
        shell: pwsh
        run: |
          git clone --branch "${{ env.VERSION }}" --depth 1 --recurse-submodules https://github.com/rustdesk/rustdesk.git rustdesk-src

      - name: Sanitize & Apply custom patch (Hide CM Popup & Redirect Auto-Update URL)
        shell: pwsh
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
          # 如需可选内置自建服务器，可在仓库 Settings -> Secrets and variables -> Actions 中添加以下 Secrets：
          RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          RELAY_SERVER: ${{ secrets.RELAY_SERVER }}
          API_SERVER: ${{ secrets.API_SERVER }}
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $patchPath = ".\custom-scripts\patch_rustdesk.py"
          if (Test-Path $patchPath) {
            # 1. 自动清理误带的 ``` Markdown 代码块标记
            # 2. 若文件被不小心重复粘贴了两遍 (main()#!/usr/bin/env python3)，自动截断保留第一份
            $raw = Get-Content $patchPath -Raw -Encoding UTF8
            $raw = $raw -replace '(?m)^\s*```.*$', ''
            if ($raw -match 'main\(\)\s*#!/usr/bin/env python3') {
              $raw = ($raw -split 'main\(\)\s*#!/usr/bin/env python3')[0] + "main()`n"
            }
            Set-Content -Path $patchPath -Value $raw -Encoding UTF8
          }
          python -X utf8 $patchPath --root .\rustdesk-src --repo "${{ github.repository }}"

      - name: Setup vcpkg with GitHub Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

      - name: Install Windows native dependencies via vcpkg manifest
        shell: pwsh
        working-directory: rustdesk-src
        run: |
          if (Test-Path "vcpkg.json") {
            & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet x64-windows-static --x-install-root="$env:VCPKG_ROOT\installed"
          } else {
            & "$env:VCPKG_ROOT\vcpkg.exe" install libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static aom:x64-windows-static
          }

      - name: Setup LLVM (for bindgen & flutter_rust_bridge)
        shell: pwsh
        run: |
          # windows-2022 镜像默认已预装 64位 LLVM (C:\Program Files\LLVM\bin)，直接复用；若不存在才通过 choco 安装最新版
          if (-not (Test-Path "C:\Program Files\LLVM\bin\libclang.dll")) {
            choco install -y llvm
          }
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Setup Rust stable toolchain (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rustdesk-src -> target"

      - name: Setup Flutter (${{ env.FLUTTER_VERSION }})
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate Flutter-Rust Bridge (FFI)
        shell: pwsh
        working-directory: rustdesk-src
        run: |
          flutter config --enable-windows-desktop
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          cd flutter
          flutter pub get
          cd ..
          flutter_rust_bridge_codegen --rust-input .\src\flutter_ffi.rs --dart-output .\flutter\lib\generated_bridge.dart --c-output .\flutter\macos\Runner\bridge_generated.h --llvm-path "C:\Program Files\LLVM"

      - name: Build RustDesk Windows x64 & Bundle Virtual Display Driver
        shell: pwsh
        working-directory: rustdesk-src
        run: |
          pip install -r libs/portable/requirements.txt
          # 先编译 Rust 核心库与 Flutter Windows 界面（暂不打包单文件，以便注入 usbmmidd_v2 虚拟显示器驱动）
          python -X utf8 build.py --portable --flutter --hwcodec --vram --skip-portable-pack
          # 下载并解压官方 usbmmidd_v2 虚拟显示器驱动到 Release 目录
          Invoke-WebRequest -Uri "https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip" -OutFile "usbmmidd_v2.zip"
          Expand-Archive -Path "usbmmidd_v2.zip" -DestinationPath "flutter\build\windows\x64\runner\Release" -Force
          Remove-Item "usbmmidd_v2.zip" -Force
          # 打包为单文件安装程序 rustdesk-<version>-install.exe
          cd libs/portable
          python -X utf8 ./generate.py -f ../../flutter/build/windows/x64/runner/Release -o . -e ../../flutter/build/windows/x64/runner/Release/rustdesk.exe
          cd ../..
          Move-Item -Path "./target/release/rustdesk-portable-packer.exe" -Destination "./rustdesk-${{ env.VERSION }}-install.exe" -Force
          Copy-Item "./rustdesk-${{ env.VERSION }}-install.exe" "./rustdesk-${{ env.VERSION }}-x86_64.exe" -Force

      - name: Publish to GitHub Releases (Auto-Update Endpoint)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: "RustDesk ${{ env.VERSION }} (Custom Windows x64)"
          body: |
            基于官方 RustDesk `${{ env.VERSION }}` 自动同步编译的 Windows 64位 (x86_64) 客户端：
            - **静默被控**：已移除/隐藏被控端连接管理弹窗（CM 窗口）
            - **自动更新**：已将客户端检查更新与自动更新地址指向 `${{ github.repository }}`
          draft: false
          prerelease: false
          make_latest: true
          files: |
            rustdesk-src/rustdesk-${{ env.VERSION }}-x86_64.exe
            rustdesk-src/rustdesk-${{ env.VERSION }}-install.exe
